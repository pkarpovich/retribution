# pnpm 11 stopped reading the "pnpm" field in package.json. Settings live here now.
#
# Every entry is a security fix rather than a preference, and every one is a
# patch bump inside the major the dependency already had - nothing here changes
# an API. They exist because workbox-build and its babel/ajv chain have not
# re-released since their own transitives were patched, not because anything is
# unmaintained: vite-plugin-pwa 1.3.0 and workbox-build 7.4.1 are both from May.
#
# Drop each one once the package above it ships the fix on its own.
overrides:
  serialize-javascript: ^7.0.4
  fast-uri: ^3.1.4
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.8
  "@babel/core": ^7.29.1
  "@babel/plugin-transform-modules-systemjs": ^7.29.4
  postcss: ^8.5.18
